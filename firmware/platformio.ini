; 生理信号数据采集固件 — PlatformIO 配置
; 用法：VSCode 安装 PlatformIO 扩展后打开 firmware/ 文件夹，点 Build / Upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    oxullo/MAX30100lib @ ^1.2.1   ; 裸 MAX30100（选配，config.h 中 ENABLE_MAX30100=1 时用）
; MPU6050 / GSR / PulseSensor / AD8232 均为固件内自带最小驱动，无需额外库
